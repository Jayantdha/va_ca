version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: va-ca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: va_ca
      POSTGRES_USER: va_ca
      POSTGRES_PASSWORD: va_ca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: va-ca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
