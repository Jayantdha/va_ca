# Render Free web service; database and photos are stored in Supabase.
services:
  - type: web
    name: va-ca-api
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SECRET, generateValue: true }
      - { key: ORIGINS, sync: false }                    # exact frontend origin
      - { key: DATABASE_URL, sync: false }               # Supabase session-pooler URL
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_STORAGE_BUCKET, value: va-ca-photos }
      - { key: MSG91_AUTH_KEY, sync: false }
      - { key: MSG91_TEMPLATE_ID, sync: false }
      - { key: MSG91_VAR, value: OTP }
      - { key: TURNSTILE_SECRET, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: PRICE_PAISE, value: "49900" }
